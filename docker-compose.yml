# Local development stack. Ports are bound to localhost only and are off the usual numbers (3100,
# 8100, 5442) because other local projects tend to own 3000, 8000 and 5432. The Postgres password is
# a local-only default (D-028). Until sign-in exists (slice 6) anyone who can reach the API can start
# matches that spend the provider keys in .env, so do not expose it beyond localhost (D-032).
x-api-env: &api-env
  DATABASE_URL: postgresql://arena:${POSTGRES_PASSWORD:-arena-dev}@postgres:5432/arena
  REDIS_URL: redis://redis:6379
  FIGHTERS_CONFIG: /app/config/fighters.toml
  KEY_ENCRYPTION_SECRET: ${KEY_ENCRYPTION_SECRET:-} # encrypts users' API keys at rest (D-034)

services:
  postgres:
    image: postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
    environment:
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arena-dev}
      POSTGRES_DB: arena
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5442}:5432" # not 5432: local Postgres installs often own it
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena -d arena"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7@sha256:2e3eb11462c4e3759e6972678dd051d150ff54b1e60714b3c33b701260172a90
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379" # move it if another project owns 6379

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      <<: *api-env
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:3100} # an https address in production: cookies are Secure only then
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
      ARENA_DEV_LOGIN: ${ARENA_DEV_LOGIN:-1} # local stack only: sign in as any handle (D-033)
    volumes:
      - ./config:/app/config:ro
    ports:
      - "127.0.0.1:8100:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["uv", "run", "--no-sync", "arq", "arena_api.jobs.WorkerSettings"]
    environment:
      <<: *api-env
      # This container has no Docker, so the gVisor sandbox is off here and model-written code runs inside
      # it unsandboxed (D-044): fine for this localhost stack, never for a public one. A real deployment
      # runs the worker on a host with gVisor instead.
      ARENA_SANDBOX: ${ARENA_SANDBOX:-off}
      PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:3100} # ARENA_SANDBOX=off is refused unless this is localhost
      # Only what the worker needs: model-written code can run in this container when the sandbox is off,
      # so it must not see the GitHub client secret or anything else in .env (D-068).
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    volumes:
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      API_URL: http://api:8000
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      - api

volumes:
  postgres-data:
