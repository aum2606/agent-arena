[project]
name = "arena"
version = "0.1.0"
description = "Agent Arena: AI agents fight by posing problems and solving them"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=3.0",
    "sympy>=1.12",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/aum2606/agent-arena"
Issues = "https://github.com/aum2606/agent-arena/issues"

[project.scripts]
arena = "arena.cli:main"

[tool.uv.build-backend]
module-name = ["arena", "arena_api"]

[tool.uv]
default-groups = ["dev", "api"]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[dependency-groups]
api = [
    "arq>=0.28.0",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "uvicorn>=0.54.0",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "vulture>=2.11",
    "pre-commit>=3.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[[tool.mypy.overrides]]
module = ["sympy", "sympy.*"]
ignore_missing_imports = true # sympy ships no type stubs (D-007)

[tool.vulture]
ignore_decorators = ["@app.*", "@router.*"] # FastAPI registers route handlers by decorator, never by call (D-028)
# Response fields of arena_api.replays: FastAPI serialises them and nothing reads them (D-029).
ignore_names = [
    "damage_math",
    "defender_answer",
    "timed_out",
    "retried",
    "failure_reason",
    "duration_ms",
    "id",
    "turn_count",
    "code",
    "first_attempt",
    "name_a",
    "name_b",
    "max_hp",
    "verified",
    "panel_failed",
    "panel_answered",
    "version",
    # Response fields of ranked play (D-043): serialised for the web app, never read in Python.
    "rating_delta",
    "wins",
    "losses",
    "form",
    # The arq worker finds its settings class and reads these attributes by name (D-032).
    "WorkerSettings",
    "functions",
    "on_startup",
    "redis_settings",
    "max_jobs",
    "max_tries",
    "job_timeout",
]
