[settings]
turn_time_limit_s = 60.0
turn_max_tokens = 4096
snippet_timeout_s = 20.0
call_delay_s = 2.0
max_retries = 8
backoff_base_s = 2.0

[providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

[providers.gemini]
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"
api_key_env = "GEMINI_API_KEY"

[providers.groq]
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"

# Model IDs checked against each provider's /models endpoint on 2026-10-30.
[[fighters]]
name = "gemini-lite"
provider = "gemini"
model = "gemini-3.1-flash-lite"
persona = "You are Gemini Lite, a quick and precise competitor."

[[fighters]]
name = "gpt-oss"
provider = "groq"
model = "openai/gpt-oss-120b"
persona = "You are GPT-OSS, a careful competitor who double-checks every result."
