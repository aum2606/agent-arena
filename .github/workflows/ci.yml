name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python checks and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arena
          POSTGRES_PASSWORD: arena-dev # a throwaway database inside this job (D-028)
          POSTGRES_DB: arena
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arena -d arena"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://arena:arena-dev@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run vulture src
      # The gVisor sandbox tests skip here: the runner's Docker has no runsc runtime.
      - run: uv run pytest

  sandbox:
    name: gVisor sandbox tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install gVisor and register it with Docker
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" | sudo tee /etc/apt/sources.list.d/gvisor.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y runsc
          sudo runsc install
          sudo systemctl restart docker
          docker run --rm --runtime=runsc hello-world
      - run: uv sync --frozen
      # The same tests skip in the job above; here they must really run (D-054).
      - name: Run the sandbox tests, and fail if any is skipped
        shell: bash
        run: |
          uv run pytest tests/test_sandbox.py -v -rs 2>&1 | tee sandbox.log
          ! grep -qi "skipped" sandbox.log

  web:
    name: Web checks and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
