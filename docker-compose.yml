# Local development stack. Ports are bound to localhost only and are off the usual numbers (3100,
# 8100, 5442) because other local projects tend to own 3000, 8000 and 5432. The Postgres password is
# a local-only default (D-028). Until sign-in exists (slice 6) anyone who can reach the API can start
# matches that spend the provider keys in .env, so do not expose it beyond localhost (D-032).
x-api-env: &api-env
  DATABASE_URL: postgresql://arena:${POSTGRES_PASSWORD:-arena-dev}@postgres:5432/arena
  REDIS_URL: redis://redis:6379
  FIGHTERS_CONFIG: /app/config/fighters.toml

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arena-dev}
      POSTGRES_DB: arena
    ports:
      - "127.0.0.1:5442:5432" # not 5432: local Postgres installs often own it
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena -d arena"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      <<: *api-env
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      PUBLIC_URL: http://127.0.0.1:3100
      ARENA_DEV_LOGIN: ${ARENA_DEV_LOGIN:-1} # local stack only: sign in as any handle (D-033)
    volumes:
      - ./config:/app/config:ro
    ports:
      - "127.0.0.1:8100:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["uv", "run", "--no-sync", "arq", "arena_api.jobs.WorkerSettings"]
    environment: *api-env
    env_file:
      - path: .env # provider API keys; optional so the stack still starts without them
        required: false
    volumes:
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      - api

volumes:
  postgres-data:
