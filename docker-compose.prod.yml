# For a public deployment (D-072; steps in docs/SELF_HOSTING.md). Put it on top of the local stack:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Compose stops, naming the setting, when a secret is missing, so nothing starts on a blank or local-only default.
# The worker is not part of it: run deploy/run-worker.sh on the host, next to Docker and gVisor. A container
# would run model-written code unsandboxed, or need the Docker socket, which is the whole machine.
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env} # the owner: only the migration uses it
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env} # the role the API and the worker use
    volumes:
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro # makes that role the first time the database is created
    restart: unless-stopped

  # Runs once as the database's owner, then exits; the API waits for it. Nothing else holds the owner's password.
  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["uv", "run", "--no-sync", "python", "-m", "arena_api.migrate"]
    environment:
      DATABASE_URL: postgresql://arena:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/arena
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  redis:
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    restart: unless-stopped

  api:
    environment:
      DATABASE_URL: postgresql://arena_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@postgres:5432/arena
      ARENA_AUTO_MIGRATE: "0" # the migrate service does it, as the owner
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
      # The API seals users' keys to the public key and cannot open them; the private key stays with the
      # worker on the host (D-082). The local secret the base file gives it is taken away.
      KEY_PUBLIC_KEY: ${KEY_PUBLIC_KEY:?set KEY_PUBLIC_KEY in .env (python -m arena_api.make_keys)}
      KEY_ENCRYPTION_SECRET: !reset null
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL (the https address) in .env}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:?name the header your proxy overwrites with the visitor's address}
      ARENA_DEV_LOGIN: "0" # the sign-in-as-anyone form is for localhost only
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    profiles: ["container-worker"] # off unless asked for: see the note at the top

  web:
    environment:
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:?name the header your proxy overwrites with the visitor's address}
    restart: unless-stopped
