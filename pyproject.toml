[project]
name = "arena"
version = "0.1.0"
description = "Agent Arena Phase 0: CLI balance prototype"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=3.0",
    "sympy>=1.12",
    "python-dotenv>=1.0",
]

[project.scripts]
arena = "arena.cli:main"

[tool.uv.build-backend]
module-name = ["arena", "arena_api"]

[tool.uv]
default-groups = ["dev", "api"]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[dependency-groups]
api = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "vulture>=2.11",
    "pre-commit>=3.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[[tool.mypy.overrides]]
module = ["sympy", "sympy.*"]
ignore_missing_imports = true # sympy ships no type stubs (D-007)

[tool.vulture]
ignore_decorators = ["@app.*"] # FastAPI registers route handlers by decorator, never by call (D-028)
