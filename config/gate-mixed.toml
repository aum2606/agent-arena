# Gate pool for balance runs (D-059): gpt-oss on Groq against gemini-lite on Gemini, two model families.
# Used with `arena sim --config config/gate-mixed.toml --no-panel`; the shipped fighters.toml is unchanged.
# It replaces config/gate-groq.toml (D-039), whose qwen fighter is cut off on a third of its replies (D-058).
[settings]
turn_time_limit_s = 60.0
turn_max_tokens = 4096
defender_max_tokens = 2048
snippet_timeout_s = 20.0
call_delay_s = 2.0
max_retries = 8
backoff_base_s = 2.0

[providers.groq]
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"

[providers.gemini]
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"
api_key_env = "GEMINI_API_KEY"

[[fighters]]
name = "gpt-oss"
provider = "groq"
model = "openai/gpt-oss-120b"
persona = "You are GPT-OSS, a careful competitor who double-checks every result."
reasoning_effort = "low"  # D-055

[[fighters]]
name = "gemini-lite"
provider = "gemini"
model = "gemini-3.1-flash-lite"
persona = "You are Gemini Lite, a quick and precise competitor."
